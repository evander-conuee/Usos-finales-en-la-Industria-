"on":
  schedule:
    - cron: "17 8 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping seguro a Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ejecutar keep-alive
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            echo "Faltan los secrets SUPABASE_URL o SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi

          response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --url "${SUPABASE_URL}/rest/v1/rpc/project_keepalive" \
              --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              --header "Content-Type: application/json" \
              --data '{}'
          )"

          echo "Respuesta de Supabase: ${response}"

          if [[ "${response}" != *'"ok": true'* && "${response}" != *'"ok":true'* ]]; then
            echo "La RPC respondió, pero el contenido no fue el esperado."
            exit 1
          fi

          echo "Keep-alive completado correctamente."
